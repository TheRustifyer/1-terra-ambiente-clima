<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Componentes e intercambios del sistema climático</title><desc id="desc">Diagrama de cinco componentes del sistema climático, con atmósfera y océano dentro del subsistema interno elegido, condiciones externas y flujos de materia y energía.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>
<rect x="330" y="85" width="820" height="555" rx="18" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="10 8"/><text x="740" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" fill="#334155">Sistema climático: cinco componentes acoplados</text>
<rect x="355" y="205" width="355" height="270" rx="15" fill="#f0fdfa" stroke="#0f766e" stroke-width="3" stroke-dasharray="10 8"/><text x="532" y="235" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="600" fill="#115e59">Sistema interno elegido (atmósfera + océano)</text>
<rect x="350" y="132" width="780" height="66" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="3"/><text x="740" y="157" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#92400e">Condiciones externas al subsistema atmósfera–océano</text><text x="740" y="184" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#78350f">Radiación solar · parámetros orbitales · composición · vulcanismo · tectónica</text>
<g font-family="system-ui,sans-serif" font-size="20" font-weight="600" text-anchor="middle"><rect x="385" y="285" width="135" height="92" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="452" y="339" fill="#1d4ed8">Atmósfera</text><rect x="545" y="285" width="135" height="92" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/><text x="612" y="324" fill="#115e59"><tspan x="612">Hidrosfera</tspan><tspan x="612" dy="24">(océano)</tspan></text><rect x="790" y="205" width="165" height="84" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/><text x="872" y="255" fill="#0e7490">Criosfera</text><rect x="790" y="350" width="165" height="84" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/><text x="872" y="400" fill="#166534">Biosfera</text><rect x="790" y="495" width="165" height="84" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><text x="872" y="545" fill="#6d28d9">Geosfera</text></g>
<g fill="none" stroke-width="3" marker-end="url(#arrow)"><path d="M370 165 L340 165 L340 280 L365 280" stroke="#b45309"/><path d="M520 332 L545 332" stroke="#0f766e" marker-start="url(#arrow)"/><path d="M520 300 L790 245" stroke="#0891b2"/><path d="M680 300 L790 260" stroke="#0891b2"/><path d="M520 360 L790 375" stroke="#15803d"/><path d="M680 360 L790 520" stroke="#7c3aed"/><path d="M872 434 L872 495" stroke="#7c3aed" marker-start="url(#arrow)"/></g>
<text x="740" y="610" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#334155">Intercambios: energía, agua, carbono, partículas y cantidad de movimiento</text>
</svg>